<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="终端窗口里的 neofetch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2030"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d8bff"/>
      <stop offset="1" stop-color="#33d6a6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="452" height="332" rx="24" fill="url(#edge)" opacity="0.18" filter="url(#soft)"/>
  <rect x="1" y="1" width="478" height="358" rx="22" fill="url(#bg)" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2"/>

  <circle cx="34" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="30" r="6" fill="#febc2e"/>
  <circle cx="78" cy="30" r="6" fill="#28c840"/>
  <line x1="1" y1="54" x2="479" y2="54" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="78" cy="170" r="54" fill="url(#edge)" opacity="0.12" filter="url(#soft)"/>
  <!-- Omarchy official icon, vectorized from omacom/omarchy icon.png -->
  <svg x="24" y="116" width="108" height="108" viewBox="0 0 300 300" aria-label="Omarchy logo">
    <path fill="#9ece6a" d="M0 0h300v20h-300Z M140 20h20v20h-20Z M40 40h120v20h-120Z M220 40h40v20h-40Z M0 20h20v120h-20Z M40 60h20v80h-20Z M0 140h60v20h-60Z M240 60h20v180h-20Z M40 160h20v80h-20Z M40 240h220v20h-220Z M280 20h20v260h-20Z M0 160h20v120h-20Z M140 260h20v20h-20Z M0 280h160v20h-160Z M180 280h120v20h-120Z"/>
  </svg>


  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="15">
    <text x="150" y="112" fill="#5d8bff" font-weight="600">tjq@wiki</text>
    <text x="150" y="132" fill="#8b93a7">---------</text>

    <text x="150" y="162" fill="#33d6a6">OS</text>
    <text x="219" y="162" fill="#e8eaf0">Omarchy Linux</text>

    <text x="150" y="184" fill="#33d6a6">Kernel</text>
    <text x="219" y="184" fill="#e8eaf0">6.12.101</text>

    <text x="150" y="206" fill="#33d6a6">Shell</text>
    <text x="219" y="206" fill="#e8eaf0">bash</text>

    <text x="150" y="228" fill="#33d6a6">WM</text>
    <text x="219" y="228" fill="#e8eaf0">Hyprland</text>

    <text x="150" y="250" fill="#33d6a6">Uptime</text>
    <text x="219" y="250" fill="#e8eaf0">3 weeks, 2 days</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="16">
    <text x="26" y="312" fill="#7b8496">$</text>
    <text x="44" y="312" fill="#e8eaf0">sudo pacman -Syu</text>
    <rect x="214" y="300" width="9" height="15" fill="#33d6a6">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
